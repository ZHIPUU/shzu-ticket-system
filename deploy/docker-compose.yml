services:
  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: ticket-backend
    restart: unless-stopped
    environment:
      - API_KEY=${API_KEY:-sk-change-me-in-production}
      - JWT_SECRET=${JWT_SECRET:-change-me-in-production}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-admin123}
      - DATABASE_URL=/app/data/tickets.db
      - HOST=0.0.0.0
      - PORT=8000
      - TICKET_PREFIX=T
      - TZ=Asia/Shanghai
    volumes:
      - ticket-data:/app/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - ticket-net

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    container_name: ticket-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-80}:80"
    networks:
      - ticket-net

networks:
  ticket-net:
    driver: bridge

volumes:
  ticket-data:
    driver: local
